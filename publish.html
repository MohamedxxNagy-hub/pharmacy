<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#06231F">
<title>نشر تحديث — دليل الصيدلية</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=IBM+Plex+Mono:wght@500;700&family=Tajawal:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#06231F; --teal:#12564E; --brass:#C89B3C; --brass-lit:#F2DFA8;
  --cyan:#7FD4F0; --leaf:#8BE07F; --red:#FF8B7A;
  --ink1:#fff; --ink2:rgba(255,255,255,.62); --ink3:rgba(255,255,255,.34);
  --hair:rgba(255,255,255,.11);
  --fd:'Cairo',system-ui,sans-serif; --fb:'Tajawal',system-ui,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0; padding:26px 18px calc(env(safe-area-inset-bottom,0) + 40px); min-height:100dvh;
  background:radial-gradient(ellipse 110% 70% at 50% -10%,#12564E 0,transparent 60%),
             linear-gradient(170deg,#06231F 0,#0A322C 50%,#06231F 100%);
  background-attachment:fixed; color:var(--ink1); font-family:var(--fb);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:440px;margin:0 auto}

.head{display:flex;align-items:center;gap:11px;padding-bottom:15px;border-bottom:1px solid var(--hair);margin-bottom:24px}
.head-mark{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(152deg,rgba(255,255,255,.15),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.18)}
.head-mark svg{width:26px;height:26px}
.head-ar{font-family:var(--fd);font-weight:800;font-size:14.5px;line-height:1.25}
.head-en{font-family:var(--fm);font-size:8.5px;letter-spacing:1.3px;color:var(--ink3);text-transform:uppercase}

h2{font-family:var(--fm);font-size:10px;letter-spacing:2px;color:var(--brass);text-transform:uppercase;margin:24px 0 10px;font-weight:700}

.card{background:rgba(255,255,255,.045);border:1px solid var(--hair);border-radius:16px;padding:15px}
label{display:block;font-size:12px;color:var(--ink2);margin-bottom:7px}
input[type=text],input[type=password]{
  width:100%;padding:12px 13px;border-radius:11px;border:1px solid var(--hair);
  background:rgba(0,0,0,.28);color:var(--ink1);font-family:var(--fm);font-size:13px;
  direction:ltr;text-align:left;outline:none
}
input:focus{border-color:var(--cyan)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}

.drop{
  border:1.5px dashed rgba(255,255,255,.22);border-radius:15px;padding:26px 16px;text-align:center;
  cursor:pointer;transition:border-color .2s,background .2s;background:rgba(255,255,255,.03)
}
.drop:hover,.drop.on{border-color:var(--brass);background:rgba(200,155,60,.07)}
.drop svg{width:30px;height:30px;color:var(--ink3);margin-bottom:8px}
.drop b{display:block;font-size:14px;font-weight:700;margin-bottom:4px}
.drop span{font-size:11.5px;color:var(--ink3);line-height:1.7}
input[type=file]{display:none}

.facts{margin-top:12px;display:none}
.facts.show{display:block}
.fact{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--hair);font-size:12.5px}
.fact:last-child{border-bottom:none}
.fact span:first-child{color:var(--ink2)}
.fact span:last-child{font-family:var(--fm);font-size:12px}
.ok{color:var(--leaf)} .bad{color:var(--red)} .warn{color:var(--brass-lit)}

button{
  width:100%;margin-top:16px;padding:15px;border:none;border-radius:13px;cursor:pointer;
  font-family:var(--fb);font-size:15.5px;font-weight:800;
  background:linear-gradient(150deg,var(--brass-lit),var(--brass));color:#2A1D05;
  transition:opacity .2s,transform .12s
}
button:active{transform:scale(.985)}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:rgba(255,255,255,.07);color:var(--ink1);border:1px solid var(--hair);
  font-weight:500;font-size:13px;margin-top:9px;padding:11px}

.log{margin-top:16px;display:none;flex-direction:column;gap:8px}
.log.show{display:flex}
.step{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;line-height:1.65}
.step i{width:19px;height:19px;flex:none;border-radius:6px;display:grid;place-items:center;
  font-style:normal;font-size:11px;background:rgba(255,255,255,.07);color:var(--ink3);margin-top:1px}
.step.run i{background:rgba(127,212,240,.16);color:var(--cyan)}
.step.done i{background:rgba(139,224,127,.16);color:var(--leaf)}
.step.err i{background:rgba(255,139,122,.16);color:var(--red)}
.step.err{color:var(--red)}

.done-box{margin-top:18px;padding:15px;border-radius:14px;display:none;
  background:rgba(139,224,127,.09);border:1px solid rgba(139,224,127,.28);font-size:12.5px;line-height:1.9;color:#C8F0BF}
.done-box.show{display:block}
.done-box a{color:var(--cyan);word-break:break-all}

.note{margin-top:22px;padding:13px 14px;border-radius:12px;font-size:11.5px;line-height:1.95;
  background:rgba(200,155,60,.08);border:1px solid rgba(200,155,60,.24);color:var(--brass-lit)}
.note b{color:#fff}
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <div class="head-mark">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M78 26 C88 38 90 56 82 70 C73 86 54 94 37 90" stroke="#fff" stroke-width="7.5" stroke-linecap="round"/>
        <path d="M64 30 L44 58" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
        <circle cx="66" cy="27" r="6.5" fill="#fff"/>
        <path d="M20 50 H74 C74 74 62 86 47 86 C32 86 20 74 20 50 Z" fill="#3BB0DA"/>
        <path d="M46 84 C30 76 26 62 30 52 C42 56 50 66 50 78 C50 81 48 83 46 84 Z" fill="#4CB944"/>
      </svg>
    </div>
    <div>
      <div class="head-ar">نشر تحديث</div>
      <div class="head-en">Publisher · Owner Only</div>
    </div>
  </div>

  <h2>١ · الإعداد</h2>
  <div class="card">
    <label>توكن GitHub</label>
    <input type="password" id="tok" placeholder="github_pat_..." autocomplete="off" spellcheck="false">
    <div class="row2" style="margin-top:11px">
      <div><label>المالك</label><input type="text" id="owner" value="mohamedxxnagy-hub" spellcheck="false"></div>
      <div><label>المستودع</label><input type="text" id="repo" value="pharmacy" spellcheck="false"></div>
    </div>
    <button class="ghost" id="save">حفظ الإعداد على الجهاز ده</button>
  </div>

  <h2>٢ · الملف المصدَّر</h2>
  <div class="drop" id="drop">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>
    </svg>
    <b>اختر ملف التحديث</b>
    <span>الملف اللي نزل من ☰ ← الإعدادات ← حفظ التعديلات داخل الملف</span>
  </div>
  <input type="file" id="file" accept=".html,text/html">

  <div class="facts card" id="facts"></div>

  <button id="go" disabled>نشر التحديث</button>

  <div class="log" id="log"></div>
  <div class="done-box" id="done"></div>

  <div class="note">
    <b>الصفحة دي ليك إنت بس.</b> التوكن بيتخزّن على الجهاز ده فقط ومابيترفعش مع التطبيق.
    أي حد يفتح الصفحة من غير توكن مايقدرش يعمل أي حاجة.
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const LS = 'pharmacy_publish_cfg';
let payload = null;

/* ── حفظ/تحميل الإعداد ── */
function loadCfg(){
  try{
    const c = JSON.parse(localStorage.getItem(LS) || '{}');
    if(c.tok) $('tok').value = c.tok;
    if(c.owner) $('owner').value = c.owner;
    if(c.repo) $('repo').value = c.repo;
  }catch(e){}
}
$('save').addEventListener('click', ()=>{
  try{
    localStorage.setItem(LS, JSON.stringify({
      tok: $('tok').value.trim(), owner: $('owner').value.trim(), repo: $('repo').value.trim()
    }));
    $('save').textContent = 'اتحفظ ✓';
    setTimeout(()=> $('save').textContent = 'حفظ الإعداد على الجهاز ده', 1800);
  }catch(e){ alert('التخزين مش متاح'); }
});
loadCfg();

/* ── ترميز UTF-8 ⇄ Base64 ── */
function toB64(str){
  const b = new TextEncoder().encode(str);
  let s = '', C = 0x8000;
  for(let i=0;i<b.length;i+=C) s += String.fromCharCode.apply(null, b.subarray(i, i+C));
  return btoa(s);
}
function fromB64(b64){
  const bin = atob(String(b64).replace(/\s/g,''));
  const b = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) b[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(b);
}

/* ── اختيار الملف ── */
$('drop').addEventListener('click', ()=> $('file').click());
['dragover','dragenter'].forEach(e=> $('drop').addEventListener(e, ev=>{ ev.preventDefault(); $('drop').classList.add('on'); }));
['dragleave','drop'].forEach(e=> $('drop').addEventListener(e, ()=> $('drop').classList.remove('on')));
$('drop').addEventListener('drop', ev=>{ ev.preventDefault(); if(ev.dataTransfer.files[0]) readFile(ev.dataTransfer.files[0]); });
$('file').addEventListener('change', e=>{ if(e.target.files[0]) readFile(e.target.files[0]); });

function readFile(f){
  const r = new FileReader();
  r.onload = ()=> inspect(f.name, r.result);
  r.onerror = ()=> alert('تعذّر قراءة الملف');
  r.readAsText(f, 'utf-8');
}

function inspect(name, html){
  const facts = $('facts');
  const rows = [];
  const push = (k,v,cls)=> rows.push(`<div class="fact"><span>${k}</span><span class="${cls||''}">${v}</span></div>`);

  let items = 0, valid = false;
  try{
    const m = html.match(/id="embedded-data"[^>]*>([\s\S]*?)<\/script>/);
    if(m){ items = JSON.parse(m[1]).length; valid = items > 0; }
  }catch(e){}

  const build = (html.match(/const APP_BUILD = '([^']+)'/) || [])[1] || '—';

  push('الملف', name.length > 30 ? name.slice(0,28)+'…' : name);
  push('الحجم', (new Blob([html]).size/1024).toFixed(0) + ' KB');
  push('الأصناف', valid ? items : 'مش لاقيها', valid ? 'ok' : 'bad');
  push('إصدار الملف', build);

  facts.innerHTML = rows.join('');
  facts.classList.add('show');

  if(!valid){
    payload = null; $('go').disabled = true;
    facts.innerHTML += '<div class="fact"><span class="bad">⚠️ الملف ده مش نسخة صالحة من التطبيق</span><span></span></div>';
    return;
  }
  payload = html;
  $('go').disabled = false;
}

/* ── سجل الخطوات ── */
function step(txt){
  const d = document.createElement('div');
  d.className = 'step run';
  d.innerHTML = '<i>•</i><span>' + txt + '</span>';
  $('log').appendChild(d);
  return {
    ok(t){ d.className='step done'; d.querySelector('i').textContent='✓'; if(t) d.querySelector('span').textContent=t; },
    err(t){ d.className='step err'; d.querySelector('i').textContent='✕'; d.querySelector('span').textContent=t; }
  };
}

/* ── GitHub API ── */
async function gh(path, tok, owner, repo, opts){
  const url = `https://api.github.com/repos/${owner}/${repo}/contents/${path}`;
  const res = await fetch(url, Object.assign({
    headers: {
      'Authorization': 'Bearer ' + tok,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    }
  }, opts || {}));
  return res;
}

async function getFile(path, tok, owner, repo){
  const r = await gh(path + '?ref=main&t=' + Date.now(), tok, owner, repo);
  if(r.status === 404) return null;
  if(!r.ok) throw new Error('HTTP ' + r.status + ' — ' + (await r.text()).slice(0,120));
  return await r.json();
}

async function putFile(path, tok, owner, repo, content, sha, msg){
  const body = { message: msg, content: toB64(content), branch: 'main' };
  if(sha) body.sha = sha;
  const r = await gh(path, tok, owner, repo, {
    method: 'PUT', headers: {
      'Authorization': 'Bearer ' + tok,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      'Content-Type': 'application/json'
    }, body: JSON.stringify(body)
  });
  if(!r.ok) throw new Error('HTTP ' + r.status + ' — ' + (await r.text()).slice(0,160));
  return await r.json();
}

/* ── رقم إصدار جديد دائمًا ── */
function newVersion(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return 'v' + d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate())
       + '-' + p(d.getHours()) + p(d.getMinutes());
}

/* ── النشر ── */
$('go').addEventListener('click', async ()=>{
  const tok = $('tok').value.trim(), owner = $('owner').value.trim(), repo = $('repo').value.trim();
  if(!tok){ alert('حط التوكن الأول'); return; }
  if(!payload){ alert('اختار الملف الأول'); return; }
  if(!confirm('هيتم رفع التحديث للموظفين. تمام؟')) return;

  $('go').disabled = true;
  $('log').innerHTML = ''; $('log').classList.add('show');
  $('done').classList.remove('show');

  const ver = newVersion();
  try{
    /* ١) تأكيد الوصول */
    let s = step('بتأكد من التوكن والمستودع…');
    const swFile = await getFile('sw.js', tok, owner, repo);
    if(!swFile) throw new Error('sw.js مش موجود في المستودع');
    s.ok('التوكن شغّال ✓');

    /* ٢) تجهيز index.html */
    s = step('بجهّز ملف التطبيق…');
    let html = payload;
    if(/const APP_BUILD = '[^']*'/.test(html)){
      html = html.replace(/const APP_BUILD = '[^']*'/, "const APP_BUILD = '" + ver + "'");
    }
    s.ok('إصدار التطبيق: ' + ver);

    /* ٣) رفع index.html */
    s = step('برفع index.html…');
    const idx = await getFile('index.html', tok, owner, repo);
    await putFile('index.html', tok, owner, repo, html, idx && idx.sha, 'تحديث البيانات — ' + ver);
    s.ok('index.html اترفع ✓');

    /* ٤) رفع sw.js برقم جديد */
    s = step('بحدّث sw.js…');
    let sw = fromB64(swFile.content);
    if(!/const VERSION = '[^']*'/.test(sw)) throw new Error('مالقيتش VERSION في sw.js');
    sw = sw.replace(/const VERSION = '[^']*'/, "const VERSION = '" + ver + "'");
    await putFile('sw.js', tok, owner, repo, sw, swFile.sha, 'رفع الإصدار — ' + ver);
    s.ok('sw.js اتحدّث ✓');

    /* تم */
    const link = 'https://' + owner + '.github.io/' + repo + '/';
    $('done').innerHTML =
      '<b>✅ التحديث اتنشر.</b><br>' +
      'الإصدار: <span style="font-family:var(--fm)">' + ver + '</span><br>' +
      'GitHub بياخد دقيقة أو اتنين للنشر.<br><br>' +
      'الموظفين هيشوفوا إشعار التحديث أول ما يفتحوا التطبيق وعندهم نت.<br><br>' +
      '<a href="' + link + '" target="_blank" rel="noopener">' + link + '</a>';
    $('done').classList.add('show');

  }catch(err){
    step('').err('❌ ' + (err && err.message ? err.message : err));
    $('go').disabled = false;
  }
});
</script>
</body></html>
